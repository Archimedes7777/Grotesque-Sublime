name: Skills integrity

# Zero-trust gate: every change is re-verified, nothing is trusted by default.
# See SECURITY.md section 3.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only token: this job inspects the tree and never writes.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    # Pinned image: its Python (3.12) must match a wheel in the tool lock.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Hash drift, unlocked skills, scripts in skills, hidden Unicode,
      # symlink escapes, invalid .claude/settings.json.
      - name: Verify skills against skills-lock.json
        run: node scripts/verify-skills.mjs

      # Proves the upstream watch script hashes folders exactly like the
      # installer does, so a monthly "no drift" result can be trusted.
      - name: Upstream watch script self-test
        run: node scripts/check-upstream.mjs --self-test

      - name: Check hook script syntax
        run: |
          bash -n .claude/hooks/zero-trust-guard.sh
          bash -n .claude/hooks/verify-skills-on-start.sh

      - name: Guard hook regression tests
        run: bash scripts/test-guard.sh

      # Same hash-locked tools as the cloud environment. Wheels only, every
      # file checked against its SHA-256, so no package build code runs.
      - name: Install lint tools from tools/lint-requirements.lock
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary=:all: --no-deps -r tools/lint-requirements.lock
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      # shellcheck on hooks and scripts, yamllint on workflows, lock format.
      - name: Lint security-critical files
        run: bash scripts/lint.sh
